name: Version

# Keeps a "Version Packages" pull request open on `main`: it consumes the
# changesets on the branch, bumps `package.json` and updates `CHANGELOG.md`.
# Merging it does not publish anything — publishing happens when a `v*` tag is
# pushed on the merged commit (see release.yml).
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Open or update version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch
      pull-requests: write # open and update the PR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update version PR
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
